name: postgresql-lab

services:
  postgres:
    image: postgres:18.6

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      # Persistent PostgreSQL database files.
      - postgres_data:/var/lib/postgresql

      # Generated TPC-H CSV files.
      # ./data — шлях відносно compose.yaml у WSL.
      # /data — шлях, який бачить PostgreSQL-контейнер.
      # ro — контейнер може лише читати файли.
      - ./data:/data:ro

    shm_size: 256mb

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data: